<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Capstan icon · Brushed Silver Noir
       A faceted wolf head in brushed silver. The snout narrows into a downward chevron
       (the "pull" arrow) above a landing bar. One crimson wolf eye: the brand's only colour. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCDCDC" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#808080" stop-opacity=".18"/>
      <stop offset="1" stop-color="#464646" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="mist" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- brushed silver: the four locked stops, lit side and shadow side -->
    <linearGradient id="silverL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCDCDC"/>
      <stop offset=".3" stop-color="#C2C2C2"/>
      <stop offset=".62" stop-color="#808080"/>
      <stop offset="1" stop-color="#464646"/>
    </linearGradient>
    <linearGradient id="silverR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8B8B8"/>
      <stop offset=".3" stop-color="#9A9A9A"/>
      <stop offset=".62" stop-color="#5E5E5E"/>
      <stop offset="1" stop-color="#2E2E2E"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
    <pattern id="grain" width="4" height="2" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity=".07"/>
      <rect y="1" width="4" height="1" fill="#000" opacity=".08"/>
    </pattern>
    <radialGradient id="eye" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FF3B45"/>
      <stop offset=".55" stop-color="#C4121C"/>
      <stop offset="1" stop-color="#5A050A"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="head">
      <path d="M50 116 L68 32 L106 82 L128 90 L150 82 L188 32 L206 116 L226 134 L212 142 L232 160 L182 170 L128 216 L74 170 L24 160 L44 142 L30 134 Z"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#tile)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#mist)"/>
  <rect x="5" y="5" width="246" height="246" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- head: lit left half, shadow right half, then brushed grain over both -->
  <g clip-path="url(#head)">
    <rect x="0" y="0" width="128" height="256" fill="url(#silverL)"/>
    <rect x="128" y="0" width="128" height="256" fill="url(#silverR)"/>
    <rect width="256" height="256" fill="url(#grain)"/>
    <!-- facet planes -->
    <path d="M128 90 L106 82 L92 128 L128 150 Z" fill="#fff" opacity=".10"/>
    <path d="M128 90 L150 82 L164 128 L128 150 Z" fill="#000" opacity=".10"/>
    <path d="M30 134 L92 128 L74 170 L24 160 L44 142 Z" fill="#000" opacity=".22"/>
    <path d="M226 134 L164 128 L182 170 L232 160 L212 142 Z" fill="#000" opacity=".32"/>
    <!-- snout: the downward chevron -->
    <path d="M92 128 L128 150 L164 128 L182 170 L128 216 L74 170 Z" fill="#000" opacity=".16"/>
    <path d="M128 150 L128 216" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <!-- inner ears -->
  <path d="M72 52 L98 86 L78 102 Z" fill="url(#ear)"/>
  <path d="M184 52 L158 86 L178 102 Z" fill="url(#ear)"/>

  <!-- top highlight edge (bevel) -->
  <path d="M50 116 L68 32 L106 82 L128 90 L150 82 L188 32" fill="none" stroke="#F2F2F2" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- eyes: left silver-dark, right crimson -->
  <path d="M86 126 L114 134 L98 140 Z" fill="#0A0A0B"/>
  <g>
    <path d="M170 126 L142 134 L158 140 Z" fill="#E0141F" filter="url(#glow)" opacity=".9"/>
    <path d="M170 126 L142 134 L158 140 Z" fill="url(#eye)"/>
    <path d="M154 132 L157 131" stroke="#fff" stroke-opacity=".8" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- nose -->
  <path d="M118 192 L138 192 L128 204 Z" fill="#0A0A0B"/>

  <!-- landing bar: the "pull" lands here -->
  <rect x="92" y="226" width="72" height="5" rx="2.5" fill="url(#silverL)"/>
</svg>
